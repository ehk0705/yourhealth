<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | YourHealth</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Afficher "En cours de développement", puis quitter la page (redirection) -->
  <script>
    setTimeout(function () {
      window.location.href = "index.html"; /* change la destination si besoin */
    }, 6000);
  </script>

  <style>
    :root{
      --bg:#0b1220;
      --card:#121b2e;
      --txt:#eef2ff;
      --muted:#b9c2d6;
      --accent:#7dd3fc;
      --border:rgba(255,255,255,.12);
      --yellow:#facc15;
      --ok:#34d399;
      --bad:#fb7185;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#070b14,var(--bg));
      color:var(--txt);
    }
    main{padding:22px 16px}
    .wrap{max-width:980px;margin:0 auto}
    h1{font-size:26px;margin:0 0 10px}
    h2{margin:0 0 12px}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      margin-bottom:16px;
    }
    label{display:block;margin-top:12px}
    textarea{
      width:100%;
      margin-top:6px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#0b1220;
      color:var(--txt);
      outline:none;
      min-height:160px;
      resize:vertical;
    }
    textarea:focus{border-color:rgba(125,211,252,.6)}
    button{
      margin-top:16px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--txt);
      cursor:pointer;
    }
    button:hover{border-color:rgba(125,211,252,.55)}
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:var(--muted)}
    .info{
      color:var(--yellow);
      font-size:14px;
      margin-top:10px;
      line-height:1.35;
    }
    .hint{font-size:13px;color:var(--muted);margin-top:8px}
    .status{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      display:none;
    }
    .status.ok{display:block;border-color:rgba(52,211,153,.4);color:var(--ok)}
    .status.bad{display:block;border-color:rgba(251,113,133,.4);color:var(--bad)}
    .count{font-size:13px;color:var(--muted);margin-top:6px;text-align:right}
    /* Champ anti-spam (piège) */
    .hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}

    /* Affichage du message "En cours de développement" */
    .dev-note{
      text-align:center;
      padding:26px 18px;
    }
    .dev-note p{
      margin:0;
      color:var(--muted);
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div id="site-header"></div>

<main>
  <div class="wrap">

    <!-- Message visible, puis redirection automatique -->
    <section class="card dev-note" aria-live="polite">
      <h1>En cours de développement</h1>
      <p>Redirection automatique…</p>
    </section>

  </div>
</main>

<!-- FOOTER -->
<div id="site-footer"></div>

<script>
  fetch("includes/header.html")
    .then(r => r.ok ? r.text() : "")
    .then(html => { if (html) document.getElementById("site-header").innerHTML = html; });

  fetch("includes/footer.html")
    .then(r => r.ok ? r.text() : "")
    .then(html => { if (html) document.getElementById("site-footer").innerHTML = html; });
</script>

</body>
</html>
